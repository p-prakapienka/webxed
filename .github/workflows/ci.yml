name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build/test -DCMAKE_BUILD_TYPE=Release
      - name: Build tests
        run: cmake --build build/test --target webxed_tests --config Release
      - name: Test
        run: ctest --test-dir build/test --output-on-failure

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Configure
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: List web bundle
        run: ls -R build/web
      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: webxed-web
          path: build/web/
          retention-days: 14
